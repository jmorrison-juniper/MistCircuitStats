name: CodeQL

# The shared workflow in misthelper-devtools runs the analysis. This file keeps
# its name and the shared job keeps the job ID analyze, so code scanning keeps
# the same configuration and the same alerts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  # The auto-merge workflow starts this workflow after a merge, because a
  # merge by GITHUB_TOKEN starts no push run.
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-codeql.yml@b140350ebc40e61b57a3a65731c0df520f143661 # v0.6.0
    with:
      languages: '["python"]'

