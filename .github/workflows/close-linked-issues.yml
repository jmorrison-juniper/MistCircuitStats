name: Close linked issues on merge

# The shared workflow in misthelper-devtools closes each issue that a merged
# pull request names with a closing keyword. An auto-merged pull request starts
# no closed event, so the schedule sweeps the recent merges.
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '43 */12 * * *'
  workflow_dispatch:
    inputs:
      lookback-hours:
        description: The hours of merged pull requests to sweep
        required: false
        default: '24'

concurrency:
  group: close-linked-issues
  cancel-in-progress: false

permissions: {}

jobs:
  close-linked-issues:
    permissions:
      issues: write
      pull-requests: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-close-linked-issues.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      lookback-hours: ${{ github.event.inputs.lookback-hours || '24' }}
