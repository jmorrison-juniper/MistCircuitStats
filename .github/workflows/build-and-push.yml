name: Build and Push Multi-Arch Container

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*.*.*'
  # The auto-merge workflow starts this workflow after a merge, because a
  # merge by GITHUB_TOKEN starts no push run.
  workflow_dispatch:

permissions: {}

jobs:
  # The shared workflow in misthelper-devtools builds the image with Buildx and
  # pushes it to GHCR. The version is YY.MM.DD.HH.MM in UTC, and it is also an
  # image tag.
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-container-image.yml@efd236ba17b0a7f9258ddac31168773a7af53e96 # main
    with:
      image-name: ${{ github.repository_owner }}/mistcircuitstats
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=ref,event=tag
        type=sha
        type=raw,value=latest,enable={{is_default_branch}}
      version-tag: true
      build-args: |
        BUILD_DATE={version}
        VERSION={version}

  release:
    name: Create GitHub Release
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          TAG="v${VERSION}"
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes \
            --notes "**Container image:** \`${IMAGE}:${VERSION}\` (also tagged \`latest\`)"