name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The auto-merge workflow starts this workflow after a merge, because a
  # merge by GITHUB_TOKEN starts no push run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The shared workflow in misthelper-devtools runs each gate as its own job.
  # Each job installs requirements-dev.txt, which pins every gate tool. Each
  # check name starts with the job ID, for example "gates / Ruff (lint)".
  gates:
    permissions:
      contents: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-python-quality-gates.yml@0b969be7f60599f9a19ebc3069161f9353a1d830 # v0.5.2
    with:
      python-version: '3.13'
      cache-dependency-path: requirements-dev.txt
      ruff: true
      black: true
      bandit: true
      bandit-args: -r . -ll -x ./.github,./.specify,./docs,./specs,./templates
      pip-audit: true
      radon: true
      radon-args: . --exclude .github/*,.specify/*,docs/*,specs/*,templates/*
      radon-max: 15
      vulture: true
      vulture-args: . --min-confidence 90 --exclude .github,.specify,docs,specs,templates
      interrogate: true
      pydoclint: true

  # The shared workflow opens one issue for each failed gate on main and closes
  # that issue after the gate passes. It reads the results output of the gates.
  quality_gate_issues:
    name: "Sync quality-gate issues"
    needs: gates
    if: ${{ always() }}
    permissions:
      issues: write
      pull-requests: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-quality-gate-issues.yml@0b969be7f60599f9a19ebc3069161f9353a1d830 # v0.5.2
    with:
      results: ${{ needs.gates.outputs.results }}
