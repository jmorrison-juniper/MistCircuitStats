name: STE lint

# The workflow has no `paths` filter. Branch protection can require the
# `STE compliance` check, and a filtered workflow never starts on a
# pull request that changes other files, so the check never reports and the
# pull request blocks. The job costs about one minute.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One event starts one run: the push trigger is scoped to `main`, and a pull
# request starts its own run. A new commit cancels the previous run on a
# branch, but never on `main`.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  ste-lint:
    permissions:
      contents: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-ste-lint.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      files: README.md AGENTS.md .github/copilot-instructions.md docs/customer_response_wan_insights.md .github/PULL_REQUEST_TEMPLATE.md
      config: .ste-linter.toml
      min-score: 80
