name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The auto-merge workflow starts this workflow after a merge, because a
  # merge by GITHUB_TOKEN starts no push run.
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── LINT & FORMAT ──────────────────────────────────────────────
  ruff:
    name: "Ruff (lint)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  black:
    name: "Black (format check)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install black
      - run: black --check .

  # ── SECURITY ──────────────────────────────────────────────────
  bandit:
    name: "Bandit (security)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install bandit
      - run: bandit -r . -ll -x ./.github,./.specify,./docs,./specs,./templates

  pip_audit:
    name: "pip-audit (CVE scan)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  # ── CODE QUALITY ──────────────────────────────────────────────
  radon:
    name: "Radon (complexity)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # requirements-dev.txt installs radon and misthelper-devtools, which
      # provides the complexity-gate command.
      - run: pip install -r requirements-dev.txt
      - name: Check cyclomatic complexity
        shell: bash
        run: |
          radon cc . -a -nb --exclude '.github/*,.specify/*,docs/*,specs/*,templates/*'
          radon cc . -j --exclude '.github/*,.specify/*,docs/*,specs/*,templates/*' | complexity-gate --max 15

  vulture:
    name: "Vulture (dead code)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install vulture
      - run: vulture . --min-confidence 90 --exclude '.github,.specify,docs,specs,templates'

  # ── DOCUMENTATION ─────────────────────────────────────────────
  interrogate:
    name: "Interrogate (docstring coverage ≥90%)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install interrogate
      - run: interrogate -v .

  pydoclint:
    name: "Pydoclint (docstring quality)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pydoclint
      - run: pydoclint .

  # ── GATE RESULTS → GITHUB ISSUES ─────────────────────────────
  # The shared workflow in misthelper-devtools opens one issue for each failed
  # gate on main and closes that issue after the gate passes. The needs list is
  # the gate list, so a new gate needs one edit only.
  quality_gate_issues:
    name: "Sync quality-gate issues"
    needs:
      - ruff
      - black
      - bandit
      - pip_audit
      - radon
      - vulture
      - interrogate
      - pydoclint
    if: ${{ always() }}
    permissions:
      issues: write
      pull-requests: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-quality-gate-issues.yml@bf1ba8a29ee9bab27b721db6e613fd5cd83d82fa # v0.4.0
    with:
      results: ${{ toJSON(needs) }}
